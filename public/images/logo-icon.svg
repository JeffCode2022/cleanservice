<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" className="w-full h-full">
  <defs>
    <!-- Cyan to Sky Gradient -->
    <linearGradient id="cmShieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    
    <!-- Droplet Gradient -->
    <linearGradient id="cmDropGrad" x1="32" y1="18" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Inner Core Glow -->
    <linearGradient id="cmCoreGrad" x1="26" y1="26" x2="38" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="cmStarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </radialGradient>
    
    <filter id="cmDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Exterior Hexagonal Shield Ring -->
  <path 
    d="M32 4L54 15V33C54 45.5 44.6 56.7 32 60C19.4 56.7 10 45.5 10 33V15L32 4Z" 
    stroke="url(#cmShieldGrad)" 
    stroke-width="3" 
    stroke-linejoin="round"
    fill="#FFFFFF"
    fill-opacity="0.04"
    filter="url(#cmDropShadow)"
  />

  <!-- Purity Water Droplet (Core) -->
  <path 
    d="M32 17C32 17 21 31.5 21 38.5C21 44.57 25.93 49.5 32 49.5C38.07 49.5 43 44.57 43 38.5C43 31.5 32 17 32 17Z" 
    fill="url(#cmDropGrad)"
  />

  <!-- Specular Reflection on Droplet -->
  <path 
    d="M26 34C26 29 30 22 32 20C30 24 25.5 30 26 36C26.5 42 30 45 30 45C27 43 26 38.5 26 34Z" 
    fill="url(#cmCoreGrad)"
  />

  <!-- Diamond Sparkle of Cleanliness at Top -->
  <path 
    d="M32 7L34 12L39 14L34 16L32 21L30 16L25 14L30 12L32 7Z" 
    fill="url(#cmStarGlow)"
  />
</svg>
